
services:

  mysql-db:
    image: mysql:8.4
    container_name: mysql-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ticket-db-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ticket-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ticket-app:v2
    container_name: ticket-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      mysql-db:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:5.2.2
    container_name: phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql-db
      PMA_PORT: 3306
    depends_on:
      mysql-db:
        condition: service_healthy

volumes:
  ticket-db-data:
    name: ticket-db-data
